name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint check
        run: npx eslint . --no-error-on-unmatched-pattern || echo "No lint config found, skipping strict lint failure"

      - name: Build
        run: node build.js
